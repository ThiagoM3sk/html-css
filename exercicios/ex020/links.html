<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* SELETORES PERSONALIZADOS
        # = id
        . = class
        : = pseudoclasses
        :: = pseudoelementos
        > = filho direto (children)
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: darkred;
        }
        a:hover{
           text-decoration: underline;
           color: black;
        }
        a:active{
            color: blue;
        }
        .especial{
            background-color: lightcoral;
        }
        .especial::before{
            content: "🠊 ";
        }
        .especial::after{
            content: " 🠈";
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://youtube.com" target="_blank">YouTube</a></li>
        <li><a href="https://www.github.com/thiagom3sk" target="_blank" class="especial">GitHub</a></li>
        <li><a href="https://www.stackoverflow.com" target="_blank">Stack Overflow</a></li>
    </ul>
</body>
</html>
