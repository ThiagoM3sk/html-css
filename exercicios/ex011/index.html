<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio preload="metadata" controls>
        <source src="midias/stick_the_landing-everet_almond.mp3" type="audio/mpeg">
        <source src="midias/stick_the_landing-everet_almond.ogg" type="audio/ogg">
        <source src="midias/stick_the_landing-everet_almond.wav" type="audio/wav">
        <p>Seu navegador infelizmente não suporta áudios. <a href="midias/stick_the_landing-everet_almond.mp3">Clique aqui para baixar o arquivo</a></p>
    </audio>
    <!-- Compatibilidade: MP3, WAV & OGG-->
</body>
</html>
