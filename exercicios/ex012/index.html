<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML</title>
</head>
<body>
    <h1>Vídeo em HTML</h1>
    <p>Este vídeo está hospegado em meu site</p>

    <video controls width="560" autoplay loop poster="#"> <!--poster="imagens/thumb.png"-->
        <source src="midias/meu_video.mp4" type="video/mp4">
        <source src="midias/meu-video1.mp4" type="video/mp4">
        <source src="midias/meu-video.ogv" type="video/ogg">
        <p>Seu navegador não suporta a tag de vídeo.</p>
    </video>

    <h1>Inserindo vídeos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/QPgSaUufaVU?si=XGYuTY8QtGrxtFVD" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
